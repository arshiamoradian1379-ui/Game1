<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Top-Down 3D Shooter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;font-family:system-ui,Segoe UI,Tahoma,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.panel{position:absolute;background:#0009;border:1px solid #ffffff22;border-radius:14px;padding:9px 13px;backdrop-filter:blur(5px);font-weight:700}
#stats{top:14px;left:14px;direction:ltr}
#help{top:14px;right:14px;font-size:13px;direction:rtl}
#msg{left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;font-size:34px;display:none}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
.stick{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff13;border:2px solid #ffffff25;bottom:30px;pointer-events:auto}
#joy{left:25px}#fire{right:25px;width:105px;height:105px;display:grid;place-items:center;font-size:35px}
@media(max-width:800px){#mobile{display:block}#help{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stats" class="panel">❤️ 100 &nbsp; 🔫 12 &nbsp; 🧟 0 &nbsp; ⭐ 0</div>
  <div id="help" class="panel">WASD حرکت · موس هدف‌گیری · کلیک شلیک · R خشاب</div>
  <div id="msg" class="panel"></div>
</div>
<div id="mobile"><div id="joy" class="stick"></div><div id="fire" class="stick">🔫</div></div>

<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W,H,DPR;
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const keys={}, mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload();if(e.key==='Enter'&&state.over)reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
C.addEventListener('mousedown',()=>mouse.down=true);
addEventListener('mouseup',()=>mouse.down=false);

let state;
function reset(){
 state={over:false,score:0,wave:1,kills:0,spawn:0,flash:0,shake:0,ammo:12,maxAmmo:12,reloading:0,
        player:{x:0,y:0,hp:100,r:.55,speed:5.5,angle:0},z:[],bullets:[],parts:[],time:0};
}
reset();

const world=24;
function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function worldToScreen(x,y){
 const scale=Math.min(W,H)/(world*2.05);
 return {x:W/2+(x-state.player.x)*scale,y:H/2+(y-state.player.y)*scale,s:scale};
}
function spawnZombie(){
 let a=Math.random()*Math.PI*2, r=rnd(11,16);
 state.z.push({x:state.player.x+Math.cos(a)*r,y:state.player.y+Math.sin(a)*r,
   r:.48,hp:2+Math.floor(state.wave/3),max:2+Math.floor(state.wave/3),speed:rnd(1.15,1.75)+state.wave*.06,
   hit:0});
}
function muzzle(){
 const p=state.player; let dx=Math.cos(p.angle),dy=Math.sin(p.angle);
 state.bullets.push({x:p.x+dx*.7,y:p.y+dy*.7,vx:dx*18,vy:dy*18,life:1.2});
 state.ammo--;state.flash=.08;state.shake=2;
 for(let i=0;i<5;i++)state.parts.push({x:p.x+dx*.7,y:p.y+dy*.7,vx:rnd(-2,2),vy:rnd(-2,2),life:.25,type:'spark'});
}
let lastShot=0;
function shoot(){
 if(state.over||state.reloading||state.ammo<=0)return;
 let now=performance.now(); if(now-lastShot<145)return; lastShot=now;muzzle();
}
function reload(){if(!state.reloading&&state.ammo<state.maxAmmo){state.reloading=1.0}}
function aim(){
 const p=worldToScreen(state.player.x,state.player.y);
 state.player.angle=Math.atan2(mouse.y-p.y,mouse.x-p.x);
}
function update(dt){
 if(state.over)return;
 state.time+=dt;
 const p=state.player;
 let ax=(keys.d?1:0)-(keys.a?1:0), ay=(keys.s?1:0)-(keys.w?1:0);
 let l=Math.hypot(ax,ay); if(l){ax/=l;ay/=l}
 p.x+=ax*p.speed*dt;p.y+=ay*p.speed*dt;
 p.x=Math.max(-world/2+.8,Math.min(world/2-.8,p.x));p.y=Math.max(-world/2+.8,Math.min(world/2-.8,p.y));
 aim();
 if(mouse.down)shoot();
 if(state.reloading){state.reloading-=dt;if(state.reloading<=0)state.ammo=state.maxAmmo}
 state.spawn-=dt;
 let target=4+state.wave*2;
 if(state.spawn<=0 && state.z.length<target){spawnZombie();state.spawn=Math.max(.18,1.2-state.wave*.04)}
 if(state.z.length===0 && state.kills>0 && state.kills%10===0)state.wave++;
 for(const b of state.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
 state.bullets=state.bullets.filter(b=>b.life>0);
 for(const z of state.z){
   let dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy)||1;
   z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;z.hit=Math.max(0,z.hit-dt);
   if(d<.95){p.hp-=22*dt;state.shake=3;if(p.hp<=0){p.hp=0;state.over=true;showMsg('💀 باختی!<br><small>Enter را بزن</small>')}}
 }
 for(const b of state.bullets){
   for(const z of state.z){if(z.dead)continue;if(Math.hypot(b.x-z.x,b.y-z.y)<.62){
      z.hp--;z.hit=.08;b.life=0;
      for(let i=0;i<7;i++)state.parts.push({x:z.x,y:z.y,vx:rnd(-3,3),vy:rnd(-3,3),life:rnd(.2,.5),type:'blood'});
      if(z.hp<=0){z.dead=true;state.score+=100;state.kills++;state.wave=1+Math.floor(state.kills/10)}
      break;
   }}
 }
 state.z=state.z.filter(z=>!z.dead);
 for(const q of state.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}
 state.parts=state.parts.filter(q=>q.life>0);
 state.flash=Math.max(0,state.flash-dt);state.shake*=.9;
 hud();
}
function hud(){document.getElementById('stats').innerHTML=`❤️ ${Math.ceil(state.player.hp)} &nbsp; 🔫 ${state.reloading?'...':state.ammo} &nbsp; 🧟 ${state.kills} &nbsp; ⭐ ${state.score}`}

function draw(){
 ctx.save();
 ctx.clearRect(0,0,W,H);
 let sx=rnd(-state.shake,state.shake),sy=rnd(-state.shake,state.shake);ctx.translate(sx,sy);
 const scale=Math.min(W,H)/(world*2.05);
 // ground
 ctx.fillStyle='#11181a';ctx.fillRect(-10,-10,W+20,H+20);
 // grid gives a 3D-ish arena perspective
 ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;
 for(let i=-world/2;i<=world/2;i++){let a=worldToScreen(i,-world/2),b=worldToScreen(i,world/2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();a=worldToScreen(-world/2,i);b=worldToScreen(world/2,i);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 // decorative obstacles
 for(let x=-10;x<=10;x+=5)for(let y=-10;y<=10;y+=5){
   let q=worldToScreen(x,y),r=12;ctx.fillStyle='#1c2927';ctx.beginPath();ctx.ellipse(q.x,q.y+7,r*1.2,r*.5,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#253a35';ctx.fillRect(q.x-r,q.y-r,r*2,r*1.5);ctx.fillStyle='#355049';ctx.fillRect(q.x-r,q.y-r,r*2,4);
 }
 // particles
 for(const q of state.parts){let s=worldToScreen(q.x,q.y);ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.type==='blood'?'#c33':'#ffd';ctx.beginPath();ctx.arc(s.x,s.y,2.5,0,7);ctx.fill()}ctx.globalAlpha=1;
 // bullets
 for(const b of state.bullets){let s=worldToScreen(b.x,b.y);ctx.fillStyle='#ffe082';ctx.shadowBlur=12;ctx.shadowColor='#ffb300';ctx.beginPath();ctx.arc(s.x,s.y,3.2,0,7);ctx.fill();ctx.shadowBlur=0}
 // zombies, farther first by y
 [...state.z].sort((a,b)=>a.y-b.y).forEach(z=>{
   let s=worldToScreen(z.x,z.y),r=scale*.48;
   ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(s.x,s.y+r*.55,r*1.1,r*.42,0,0,7);ctx.fill();
   ctx.fillStyle=z.hit?'#d66':'#567f5a';ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fill();
   ctx.fillStyle='#36523b';ctx.beginPath();ctx.arc(s.x,s.y-r*.65,r*.65,0,7);ctx.fill();
   ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(s.x-r*.22,s.y-r*.72,r*.11,0,7);ctx.arc(s.x+r*.22,s.y-r*.72,r*.11,0,7);ctx.fill();
   ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s.x-r*.22,s.y-r*.72,r*.05,0,7);ctx.arc(s.x+r*.22,s.y-r*.72,r*.05,0,7);ctx.fill();
   ctx.fillStyle='#7d2222';ctx.fillRect(s.x-r*.65,s.y-r*.05,r*1.3,4);
   ctx.fillStyle='#4caf50';ctx.fillRect(s.x-r*.65,s.y-r*.05,r*1.3*(z.hp/z.max),4);
 });
 // player
 let ps=worldToScreen(state.player.x,state.player.y),r=scale*.5;
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(ps.x,ps.y+r*.6,r*1.15,r*.42,0,0,7);ctx.fill();
 ctx.save();ctx.translate(ps.x,ps.y);ctx.rotate(state.player.angle);
 ctx.fillStyle='#2f77c7';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
 ctx.fillStyle='#f1c49b';ctx.beginPath();ctx.arc(0,-r*.35,r*.62,0,7);ctx.fill();
 ctx.fillStyle='#252525';ctx.fillRect(r*.35,-r*.12,r*1.05,r*.24);
 ctx.fillStyle='#bbb';ctx.fillRect(r*1.2,-r*.08,r*.45,r*.16);
 ctx.restore();
 if(state.flash){ctx.fillStyle='#fff8a0';ctx.globalAlpha=state.flash/.08;ctx.beginPath();ctx.moveTo(ps.x+Math.cos(state.player.angle)*r*1.7,ps.y+Math.sin(state.player.angle)*r*1.7);ctx.arc(ps.x+Math.cos(state.player.angle)*r*1.7,ps.y+Math.sin(state.player.angle)*r*1.7,12,-.8,.8);ctx.fill();ctx.globalAlpha=1}
 ctx.restore();
}
function showMsg(t){let e=document.getElementById('msg');e.innerHTML=t;e.style.display='block'}
function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
